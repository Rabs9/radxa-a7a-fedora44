# a7a-gpu-tools: /etc/systemd/system/irqbalance.service.d/a7a-gpu-irq.conf. irqbalance leaves the open stack's GPU
# interrupt on the big cluster, where 90-a7a-gpu-irq.rules puts it at the driver bind (Item E 1(a)): without this,
# irqbalance moves it back to 0-7 (cpu0) within seconds of its start (measured 2026-09-10). The policy script bans
# only that one interrupt (tools/board/a7a-irqbalance-policy). ExecStart is repeated rather than IRQBALANCE_ARGS
# set: the unit's EnvironmentFile= lines would override an Environment= here, and this keeps any arguments the owner
# puts in /etc/sysconfig/irqbalance.
[Service]
ExecStart=
ExecStart=/usr/sbin/irqbalance $IRQBALANCE_ARGS --policyscript=/usr/local/bin/a7a-irqbalance-policy
