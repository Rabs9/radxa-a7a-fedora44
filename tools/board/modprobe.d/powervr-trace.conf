# a7a open GPU stack: arm the firmware trace at init (groups MAIN|CLEANUP|CSW|BIF|PM|POW|HWR; read with fwtrace-tail.sh /
# pvrwatch.sh). init_fw_trace_mask = upstream-master driver; fw_trace_mask = the v6.16 graft (kernel 6.6.98-a7apvr.202609091531).
# (raw log type = groups | TRACE bit, hence 0x67b there). Each kernel ignores the other name with one "unknown parameter"
# line in dmesg.
options powervr init_fw_trace_mask=0x67a fw_trace_mask=0x67b
