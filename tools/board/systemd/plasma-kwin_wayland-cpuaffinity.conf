[Service]
# a7a-fedora 2026-09-10 (docs/SPEED-2026-09-10.md, Item E 1(b)). The A733 is big.LITTLE: cpu0-5 are little cores
# (capacity 401), cpu6-7 big (1024). The scheduler lets kwin_wayland's threads drift onto the little cluster and
# only migrates them to a big core after sustained load, so the compositor is slow exactly when it has been idle
# — and the same window measures differently from one run to the next. Measured with glmark2 through the
# compositor (medians of 3, the a7a Mesa PowerVR driver):
#
#   kwin on the little cores (0-5): 640x480 262 fps / 1.5 ms CPU per frame,  1000x560 33 fps / 13.8 ms
#   kwin on the big cores   (6,7):  640x480 293 fps / 0.8 ms,                1000x560 39 fps /  7.0 ms
#   kwin default            (0-7):  640x480 277 fps / 1.4 ms,                1000x560 34 fps / 12.3 ms
#
# i.e. +18% fps and half the compositor CPU at the larger size, and a number that no longer depends on how busy
# the desktop has been. Installed as
# /etc/systemd/user/plasma-kwin_wayland.service.d/a7a-cpu-affinity.conf; a7a-gpu-session and pvr-desktop only ever
# touch pvr.conf and software.conf in that directory, so this file survives both stacks and every switch.
CPUAffinity=6-7
