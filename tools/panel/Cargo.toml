[package]
name = "a7a-panel"
version = "0.1.0"
edition = "2021"
description = "Clock, power and hardware panel for the Radxa Cubie A7A (Fedora image)"
license = "GPL-2.0-only"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "canvas", "markdown", "tokio", "x11", "wayland", "thread-pool", "fira-sans"] }
# the Assistant tab: the model server's HTTP API (plain http on 127.0.0.1) and the web tools (https, rustls)
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
# killpg for MCP servers: one started through npx, uvx or sh -c is a process group, not one process
libc = "0.2"

[features]
# Drawing on the GPU through wgpu: on for a desktop. The board's build leaves it out (tools/build-panel.sh): there wgpu
# finds no Vulkan under Wayland, falls back to GLES, and the PowerVR compiler refuses one of its text shaders
# ("gl_FragCoord: only shader outputs can be made invariant", 2026-11-17), so the panel draws with tiny-skia, in software.
default = ["gpu"]
gpu = ["iced/wgpu"]

# iced_tiny_skia (MIT, its LICENSE beside it) with one change (vendor/iced_tiny_skia/src/window/compositor.rs,
# PARTIAL_REDRAWS): the board's software drawing redraws the whole window every frame, because redrawing only what
# changed left black and stale patches on its screen (2026-11-17)
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
