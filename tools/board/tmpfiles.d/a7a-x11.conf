# a7a-board-tools: /usr/lib/tmpfiles.d/a7a-x11.conf. The X11 socket directories stay out of the /tmp clean-up.
# systemd's x11.conf creates them at boot with boot-only lines (D!), which the clean-up (systemd-tmpfiles --clean, 15
# minutes after boot and daily) does not read: to it they are plain contents of /tmp, removed when older than 10 days
# and empty. On this board they are created while the clock still holds systemd's build date: the time comes later,
# from the clock chip's driver when the chip holds a valid time, else from chronyd -s (9.5 s and 10.7 s, after this
# step at 8.9 s; 2026-11-18). So at the first clean-up they look a month old, and with nobody logged in yet they are
# empty. A log-in after that had no Xwayland ("/tmp/.X11-unix does not exist") and every X11 program of the session
# crashed (2026-11-18). X keeps a directory itself but not what is in it, as Fedora's plasmalogin.conf does for its
# own: dead sockets inside still age out, and the boot still empties and creates the directories (D! is unchanged).
X /tmp/.X11-unix
X /tmp/.ICE-unix
X /tmp/.XIM-unix
X /tmp/.font-unix
