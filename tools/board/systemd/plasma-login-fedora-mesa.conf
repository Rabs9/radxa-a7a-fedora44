# a7a-gpu-tools: /etc/systemd/user/plasma-login.service.d/a7a-fedora-mesa.conf, the login greeter's UI
# (/usr/libexec/plasma-login-greeter, a user unit of the plasmalogin user's manager) on Fedora's Mesa on every boot.
# On the DDK boot a7a-gpu-session puts the Wayland-capable DDK Mesa (mesa-img-a7a) in front of glvnd through the
# loader cache; the greeter's compositor runs QPainter (plasma-login-kwin_wayland.service.d/software.conf) and offers
# no linux-dmabuf, so the DDK cannot serve the greeter and it would fall back to that build's softpipe (no LLVM).
# /usr/lib64 first = glvnd + Fedora's Mesa (llvmpipe), exactly the greeter of the open-stack boot, where this changes
# nothing (the cache has no /opt/pvr-wl there). docs/DDK-WAYLAND-2026-09-10.md, reviewer pass 2.
[Service]
Environment=LD_LIBRARY_PATH=/usr/lib64
