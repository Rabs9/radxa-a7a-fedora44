# a7a-board-tools: /usr/share/wireplumber/wireplumber.conf.d/51-a7a-ac101.conf. The AC101's 3.5 mm jack in 16-bit.
# The BSP's I2S driver (snd_sunxi_i2s.c, hw_params) sends S24_LE as 32-bit samples with the data in the low bits
# (TXIM), and the AC101 card's 16-bit slots carry the top 16 of those 32 bits: the sign byte and the sample's top 8.
# Everything played in S24_LE, the deepest format the card offers and so PipeWire's choice, came out 48 dB quiet:
# clean but faint on headphones and on a speaker, the same on Debian 13 (2026-11-18; a 16-bit beep at -30 dBFS heard,
# the same beep in 24-bit not). S16_LE goes out whole. The real fix is in the kernel (S24_LE with the 24-bit sample
# resolution); until then this covers what goes through PipeWire.
# Both directions: the I2S has ONE sample-resolution field for playback and capture (FMT0), and a capture opened in
# S24_LE sets it to 32-bit under a running 16-bit playback, which then goes silent until it is reopened (2026-11-18:
# the jack fell silent whenever its microphone side was opened; FMT0 0x1f73 under S16_LE playback).
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.platform-soc_3000000_i2s0_mach_ac101.*"
      }
      {
        node.name = "~alsa_input.platform-soc_3000000_i2s0_mach_ac101.*"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
  # The jack is the default output once the AC101 is switched on (2026-11-24, the owner: "lets make this the default"):
  # its output outranks HDMI and a USB adapter (about 1000) where nobody chose another output. A choice made in KDE's
  # sound menu is WirePlumber's configured default and still wins.
  {
    matches = [
      {
        node.name = "~alsa_output.platform-soc_3000000_i2s0_mach_ac101.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver = 2000
      }
    }
  }
]
