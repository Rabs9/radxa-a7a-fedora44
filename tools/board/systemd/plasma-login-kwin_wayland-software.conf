[Service]
# KWin 6.7 on Fedora mesa (llvmpipe) fails every EGLImage on the A7A (EGL_BAD_ALLOC, "Applying output configuration
# failed", login screen never appears). The greeter needs no GPU: QPainter backend (dumb buffers, no EGL).
# Installed as /etc/systemd/user/plasma-login-kwin_wayland.service.d/software.conf. a7a-fedora 2026-09-07.
Environment=KWIN_COMPOSE=Q
# KWin 6.8 has no QPainter backend for real displays any more: with the line above it exits at once and the screen
# stays black (2026-11-16, Fedora's updates in the emulator). Where the installed KWin lacks it, a7a-gpu-session
# writes the file below at every boot and when kwin is updated (its `greeter` command, a package trigger): a mode
# that KWin has, and on a DDK boot the DDK's variables. A setting in the file wins over the line above; with a KWin
# that has QPainter the file does not exist and nothing changes. /run: it never outlives the boot it was written for.
EnvironmentFile=-/run/a7a/greeter-kwin.env
